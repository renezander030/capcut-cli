name: Release

# Tag-driven release: pushing a vX.Y.Z tag publishes that version to npm with
# provenance and creates the GitHub release with generated notes.
# npm trusts this workflow (trusted publishing): the job proves itself with its
# OIDC token, so no npm token is stored. npm does that exchange from 11.5.1 on.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          # built and run on Windows itself: the portable test drives capcut.cmd through cmd.exe before publishing
          - { os: windows-latest, target: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'macOS'
        run: brew list --versions gnu-tar || brew install gnu-tar
      - run: npm ci
      - run: npm run build
      - name: Verify the native portable CLI and bundled templates
        env:
          CAPCUT_PORTABLE_REQUIRED: '1'
          CAPCUT_PORTABLE_EXPECT_TARGET: ${{ matrix.target }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/portable-config
          CAPCUT_CLI_APP_VERSIONS: ${{ runner.temp }}/portable-config/versions.json
        run: node --test test/portable.test.mjs
      - name: Build the release archive
        run: npm run pack:portable -- --out "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/portable/*-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/portable/*-${{ matrix.target }}.tar.gz.sha256
            ${{ runner.temp }}/portable/*-${{ matrix.target }}.zip
            ${{ runner.temp }}/portable/*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  release:
    needs: portable-native
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance (--provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: ffmpeg, so the smoke reads real media durations
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: The packed tarball installs and runs
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
          CAPCUT_CLI_APP_VERSIONS: ${{ runner.temp }}/xdg/app-versions.json
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          npm run smoke:package -- "$RUNNER_TEMP"/pack/capcut-cli-*.tgz

      - name: Build and verify the Linux x64 portable archive
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/portable-config
          CAPCUT_CLI_APP_VERSIONS: ${{ runner.temp }}/portable-config/versions.json
        run: |
          npm run pack:portable -- --out "$RUNNER_TEMP/portable"
          cd "$RUNNER_TEMP/portable"
          sha256sum -c *.sha256
          tar -xzf capcut-cli-*.tar.gz
          env PATH= ./capcut-cli-v*-linux-x64/capcut --version
          env PATH= ./capcut-cli-v*-linux-x64/capcut describe --compact

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: portable-*
          path: ${{ runner.temp }}/portable
          merge-multiple: true
      - name: Verify all release archive checksums
        run: cd "$RUNNER_TEMP/portable" && sha256sum -c *.sha256

      - name: npm 11 for trusted publishing
        run: npm install -g npm@11.12.1

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/portable/*.tar.gz
            ${{ runner.temp }}/portable/*.zip
            ${{ runner.temp }}/portable/*.sha256
