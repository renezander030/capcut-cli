name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  package:
    # What npm would ship: pack the tarball, install it into an empty prefix
    # and run the installed CLI and library (scripts/release-smoke.mjs).
    runs-on: ubuntu-latest
    name: packed tarball installs and runs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: ffmpeg, so the smoke reads real media durations
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Pack and smoke-test the tarball
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
          CAPCUT_CLI_APP_VERSIONS: ${{ runner.temp }}/xdg/app-versions.json
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          npm run smoke:package -- "$RUNNER_TEMP"/pack/capcut-cli-*.tgz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  wasm-component:
    runs-on: ubuntu-latest
    name: capability-free Wasm component
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wasm/capcut-core/package-lock.json
      - run: npm ci
      - run: npm --prefix wasm/capcut-core ci
      - run: npm --prefix wasm/capcut-core audit --audit-level=high
      - run: npm run wasm:verify
      - name: Write artifact checksum
        run: cd dist && sha256sum capcut-core.wasm > capcut-core.wasm.sha256
        working-directory: wasm/capcut-core
      - name: Install checksum-pinned Wassette 0.7.0
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/wassette.tar.gz" \
            https://github.com/microsoft/wassette/releases/download/v0.7.0/wassette_0.7.0_linux_amd64.tar.gz
          echo "c030964b92a1fb9862fc59b8c318099eba501f83a798b822cb9a394fb0f85f20  $RUNNER_TEMP/wassette.tar.gz" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/wassette"
          tar -xzf "$RUNNER_TEMP/wassette.tar.gz" -C "$RUNNER_TEMP/wassette"
      - name: Exercise all tools through MCP
        run: npm --prefix wasm/capcut-core run verify:mcp
        env:
          WASSETTE_BIN: ${{ runner.temp }}/wassette/wassette
      - uses: actions/upload-artifact@v7
        with:
          name: capcut-core-wasm
          path: |
            wasm/capcut-core/dist/capcut-core.wasm
            wasm/capcut-core/dist/capcut-core.wasm.sha256
            wasm/capcut-core/THIRD_PARTY_NOTICES.md
            LICENSE
          if-no-files-found: error

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: platform smoke (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  python-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    name: Python client (${{ matrix.os }}, ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests -v
